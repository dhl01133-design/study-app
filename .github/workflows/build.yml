name: build apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish the "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        run: gradle assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk study-briefing.apk
      - uses: actions/upload-artifact@v4
        with:
          name: study-briefing
          path: study-briefing.apk
      - name: Publish as release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest study-briefing.apk \
            --title "스터디 브리핑 build ${{ github.run_number }}" \
            --notes "Automatic build from ${{ github.sha }}"

  smoke:
    # Runs the APK on an Android emulator with demo data and saves screenshots.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: study-briefing
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/scripts/smoke.py study-briefing.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke/
      - name: Publish screenshots as release "smoke"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd smoke && zip -qr ../smoke.zip . && cd ..
          gh release delete smoke --yes --cleanup-tag || true
          gh release create smoke smoke.zip --prerelease \
            --title "Emulator smoke test, build ${{ github.run_number }}" \
            --notes "Screenshots and logs from the emulator run of ${{ github.sha }}"
