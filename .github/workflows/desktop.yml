name: build desktop overlay

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish the "desktop" release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r desktop/requirements.txt
      - name: Check the Windows-only parts (click-through, Ctrl mode, full-screen test)
        run: python desktop/tests/win_check.py
      - name: Calendar parser test
        run: python desktop/tests/test_ics.py
      - name: Build StudyOverlay.exe
        working-directory: desktop
        run: |
          echo "BUILD = ${{ github.run_number }}" > build_info.py
          pyinstaller StudyOverlay.spec
      - name: Smoke test (render demo screenshots)
        shell: pwsh
        run: |
          $exe = "desktop/dist/StudyOverlay.exe"
          Start-Process $exe -ArgumentList "--check-tz $PWD/tz.txt" -Wait
          $crash = "$env:APPDATA/StudyOverlay/crash.log"
          if (Test-Path $crash) { Get-Content $crash; throw "the exe crashed" }
          Get-Content tz.txt
          if ((Get-Content tz.txt) -ne "tz ok") { throw "time zones missing from the bundle" }
          foreach ($a in @("--shot shot_en.png", "--shot shot_ko_dark.png --lang ko --color #1f2a44")) {
            $p = Start-Process $exe -ArgumentList "--demo $a" -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode) for $a" }
          }
          if (!(Test-Path shot_en.png) -or !(Test-Path shot_ko_dark.png)) { throw "no screenshot" }
          Get-Item desktop/dist/StudyOverlay.exe, shot_*.png | Format-Table Name, Length
          "exe_MB: " + [math]::Round((Get-Item desktop/dist/StudyOverlay.exe).Length / 1MB, 1)
      - name: Measure RAM and CPU against the previous build (demo mode, idle)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          gh release download desktop -p StudyOverlay.exe -D old 2>$null
          $rows = @()
          foreach ($e in @("old/StudyOverlay.exe", "desktop/dist/StudyOverlay.exe")) {
            if (!(Test-Path $e)) { continue }
            $p = Start-Process $e -ArgumentList "--demo" -PassThru
            Start-Sleep 25
            # one-file exe: the app runs in a child of the bootloader process
            $ids = @($p.Id) + @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | % ProcessId)
            $cpu0 = ($ids | % { (Get-Process -Id $_).TotalProcessorTime.TotalMilliseconds } | Measure -Sum).Sum
            Start-Sleep 60
            $procs = $ids | % { Get-Process -Id $_ }
            $cpu1 = ($procs | % { $_.TotalProcessorTime.TotalMilliseconds } | Measure -Sum).Sum
            $ws = ($procs | % { $_.WorkingSet64 } | Measure -Sum).Sum / 1MB
            $priv = ($procs | % { $_.PrivateMemorySize64 } | Measure -Sum).Sum / 1MB
            $rows += [pscustomobject]@{ exe = $e; working_set_MB = [math]::Round($ws, 1); private_MB = [math]::Round($priv, 1);
                                         cpu_ms_per_min = [math]::Round($cpu1 - $cpu0, 0) }
            $ids | % { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
            Start-Sleep 2
          }
          $rows | Format-Table -AutoSize | Out-String -Width 200 | Tee-Object bench.txt
      - name: Publish as release "desktop"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop --yes --cleanup-tag || true
          touch bench.txt
          gh release create desktop desktop/dist/StudyOverlay.exe shot_en.png shot_ko_dark.png bench.txt \
            --title "Study Overlay (Windows) build ${{ github.run_number }}" \
            --notes "Automatic build from ${{ github.sha }}"
